<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Verde Mobile (demo)</title>
  <link rel="stylesheet" href="estilo.css">
<base target="_blank">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">TRILHA VERDE</div>
      <div class="dropdown-wrapper">
        <button class="dropdown" id="dropdownBtn" onclick="toggleDropdown()">
          <span id="dropdownLabel">Todas as Unidades</span>
          <svg class="dropdown-arrow" id="dropdownArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="dropdown-list" id="dropdownList">
          <li onclick="selectUnit('Todas as Unidades')">Todas as Unidades</li>
          <li onclick="selectUnit('Coopsul Matriz (CZS)')">Coopsul Matriz (CZS)</li>
          <li onclick="selectUnit('Unidade RA')">Unidade RA</li>
          <li onclick="selectUnit('Unidade ML')">Unidade ML</li>
          <li onclick="selectUnit('Unidade RB')">Unidade RB</li>
        </ul>
      </div>
    </div>
    <div class="header-right">
      <div class="avatar">A</div>
      <div class="user-info">
        <span class="user-name">Administrador Geral</span>
        <span class="user-role">Administrador Geral</span>
      </div>
      <button class="btn-sair" onclick="alert('Saindo do sistema...')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </header>

  <!-- BODY -->
  <div class="body">

    <!-- SIDEBAR -->
    <nav class="sidebar">
      <button class="nav-item active" onclick="setPage(this, 'visao')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-text">Visão Geral</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'cooperados')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-text">Cooperados</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'empresas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><line x1="9" y1="12" x2="9.01" y2="12"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="9" y1="16" x2="9.01" y2="16"/><line x1="15" y1="16" x2="15.01" y2="16"/></svg>
        <span class="nav-text">Empresas Parceiras</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'veiculos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <span class="nav-text">Veículo de coleta</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'pontos')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="nav-text">Pontos de Coleta</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'registro')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="M14.5 9.5 4.5 4.5l-2 5 10 5z"/><path d="m14.5 9.5 5-2.5 2 5-5 2.5z"/><path d="M19 15V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v10"/></svg>
        <span class="nav-text">Registro de coleta</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'compras')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="nav-text">Compras</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'vendas')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
        <span class="nav-text">Vendas</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'relatorios')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="nav-text">Relatórios</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'usuarios')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-text">Usuários</span>
      </button>
      <button class="nav-item" onclick="setPage(this, 'unidades')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-text">Unidades de Coleta</span>
      </button>
    </nav>

    <!-- CONTENT -->
    <main class="content">
      <div class="content-area" id="contentArea">
        <div class="chart-placeholder">
          <svg width="160" height="100" viewBox="0 0 160 100" fill="none" stroke="#7a7a5a" stroke-width="2">
            <line x1="15" y1="90" x2="150" y2="90"/>
            <line x1="15" y1="90" x2="15" y2="10"/>
            <rect x="22" y="50" width="16" height="40" fill="#7a7a5a" stroke="none" opacity="0.7"/>
            <rect x="44" y="35" width="16" height="55" fill="#7a7a5a" stroke="none" opacity="0.7"/>
            <rect x="66" y="55" width="16" height="35" fill="#7a7a5a" stroke="none" opacity="0.7"/>
            <rect x="88" y="25" width="16" height="65" fill="#7a7a5a" stroke="none" opacity="0.7"/>
            <rect x="110" y="40" width="16" height="50" fill="#7a7a5a" stroke="none" opacity="0.7"/>
            <rect x="132" y="30" width="16" height="60" fill="#7a7a5a" stroke="none" opacity="0.7"/>
          </svg>
          <p style="font-size:15px; margin-top:10px; font-weight:500;">Gráfico de Resíduos Armazenados no Último Mês</p>
        </div>
      </div>
      <div class="footer-bar">Gráfico de Resíduos Armazenados no Último Mês</div>
    </main>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
